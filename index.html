<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Odważni Nie Piją</title>
<link rel="stylesheet" href="style.css">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#6b0014">
</head>

<body>

<div class="container">

<h1>#odwazniniepiją 🥃</h1>
<div id="counter">✅ 0 | 🥃 0</div>
<div id="deckCounter">🤭 3/3 | 😈 3/3</div>
<button id="resetGame">Nowa gra</button>
<div class="decks">

  <div class="deck question-deck" id="questionBtn">
    <div class="deck-emoji">🤭</div>
    <div class="deck-title">PYTANIE</div>
  </div>

  <div class="deck challenge-deck" id="challengeBtn">
    <div class="deck-emoji">😈</div>
    <div class="deck-title">WYZWANIE</div>
  </div>
  </div>
<div id="shakeScreen" class="hidden">
    <h2>SHAKE IT 🎲🔥</h2>
</div>
<script src="app.js"></script>
<script>
  if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("service-worker.js");
  }
</script>
</body>
</html>
